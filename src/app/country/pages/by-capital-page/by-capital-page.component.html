<!-- country-seach-input -->
 <!-- Este value esta siendo emitido en search-input.component
  se conecta con el onSearch del ByCapitalPageComponent -->
<country-search-input placeholder="Buscar por capital"
  (value)="onSearch($event)"
/>

<!-- country-list -->
@if (!isError()) {
  <country-list [countries]="countries()" />
} @else {
  <h3>{{ isError() }}</h3>
}
