<!-- country-seach-input -->
 <!-- Este value esta siendo emitido en search-input.component
  se conecta con el onSearch del ByCapitalPageComponent -->
<country-search-input placeholder="Buscar por capital"
  (value)="query.set($event)"
/>

<!-- country-list -->
@if ( countryResource.error() ) {
  <h3>{{ countryResource.error() }}</h3>
} @if ( countryResource.hasValue() ) {
  <country-list [countries]="countryResource.value()!" />
}
